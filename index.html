<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Class</title>
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#3D4A66;
    --chalk:#F6F4EE;
    --card:#FFFFFF;
    --board:#2F5233;
    --board-dark:#25401F;
    --amber:#B9812E;
    --amber-dark:#96682A;
    --slate:#6B7580;
    --line:#E4E0D6;
    --danger:#A23B2E;
    --focus:#2F6FB0;
    --radius:14px;
    --shadow: 0 1px 2px rgba(27,42,74,0.06), 0 8px 24px rgba(27,42,74,0.08);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family: "Source Sans 3","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #FBF9F4 0%, var(--chalk) 55%);
    color:var(--ink);
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-tap-highlight-color: transparent;
  }

  @font-face{
    font-family:"Source Serif 4 fallback";
    size-adjust:100%;
    src:local("Georgia");
  }

  .display{
    font-family:"Source Serif 4","Iowan Old Style","Georgia",serif;
  }

  /* ---------- App shell ---------- */

  .topbar{
    display:flex;
    align-items:center;
    min-height:44px;
    padding:10px 14px;
    flex-shrink:0;
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:44px;
    min-width:44px;
    padding:6px 12px 6px 6px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:0.95rem;
    font-weight:600;
    border-radius:10px;
    cursor:pointer;
    line-height:1;
  }
  .back-link svg{ width:18px; height:18px; flex-shrink:0; }
  .back-link:hover{ color:var(--ink); background:rgba(27,42,74,0.05); }
  .back-link:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .back-link[hidden]{ display:none; }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 16px 40px;
  }

  .stage{
    width:100%;
    max-width:440px;
    position:relative;
  }

  .panel{
    width:100%;
  }
  .panel[hidden]{ display:none; }

  /* ---------- Main menu ---------- */

  .lede{
    text-align:center;
    margin-bottom:28px;
  }

  .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    color:var(--board);
    font-weight:600;
    font-size:0.85rem;
    letter-spacing:0.01em;
    margin-bottom:10px;
  }
  .kicker svg{ width:16px; height:16px; }

  h1{
    margin:0 0 10px;
    font-size:clamp(1.7rem, 5.5vw, 2.35rem);
    line-height:1.1;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .lede p{
    margin:0 auto;
    max-width:34ch;
    color:var(--slate);
    font-size:1rem;
    line-height:1.5;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .action{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    min-height:76px;
    padding:16px 18px;
    border-radius:var(--radius);
    border:1px solid transparent;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    transition: transform 120ms ease, box-shadow 120ms ease, background-color 120ms ease;
  }
  .action:active{ transform: scale(0.99); }
  .action:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .action:disabled{ cursor:default; opacity:0.75; transform:none; }

  .action-icon{
    flex-shrink:0;
    width:44px;
    height:44px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .action-icon svg{ width:22px; height:22px; }

  .action-text{ flex:1; min-width:0; }
  .action-title{
    display:block;
    font-size:1.05rem;
    font-weight:600;
    line-height:1.25;
  }
  .action-sub{
    display:block;
    font-size:0.85rem;
    margin-top:2px;
    line-height:1.3;
  }

  .action-chevron{
    flex-shrink:0;
    width:18px;
    height:18px;
    opacity:0.55;
  }

  /* schedule = quiet card */
  .action--schedule{
    background:var(--card);
    border-color:var(--line);
    box-shadow:var(--shadow);
    color:var(--ink);
  }
  .action--schedule:hover{ border-color:#CFCABB; }
  .action--schedule .action-icon{ background:#EFEDE4; color:var(--ink-soft); }
  .action--schedule .action-sub{ color:var(--slate); }

  /* initiate now = primary, board green */
  .action--now{
    background: linear-gradient(180deg, var(--board) 0%, var(--board-dark) 100%);
    color:#F3F7F1;
    box-shadow: 0 1px 2px rgba(37,64,31,0.25), 0 10px 24px rgba(37,64,31,0.28);
  }
  .action--now:hover{ box-shadow: 0 1px 2px rgba(37,64,31,0.3), 0 14px 28px rgba(37,64,31,0.32); }
  .action--now .action-icon{ background:rgba(255,255,255,0.14); color:#EDF3E9; }
  .action--now .action-sub{ color:#CBDDC4; }
  .action--now .action-chevron{ opacity:0.75; }

  .live-dot{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.04em;
    color:#DDEBD6;
    margin-bottom:1px;
  }
  .live-dot::before{
    content:"";
    width:6px; height:6px;
    border-radius:50%;
    background:#8FD37A;
    box-shadow:0 0 0 3px rgba(143,211,122,0.25);
  }

  .menu-footer{
    margin-top:26px;
    text-align:center;
  }
  .menu-back{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:44px;
    padding:8px 16px;
    border:none;
    background:transparent;
    color:var(--slate);
    font-size:0.92rem;
    font-weight:600;
    font-family:inherit;
    border-radius:10px;
    cursor:pointer;
  }
  .menu-back svg{ width:16px; height:16px; }
  .menu-back:hover{ color:var(--ink); }
  .menu-back:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* ---------- Loading panel ---------- */

  .status-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 24px;
    text-align:center;
  }

  .spinner{
    width:34px; height:34px;
    margin:0 auto 18px;
    border-radius:50%;
    border:3px solid #E4E0D6;
    border-top-color:var(--board);
    animation:spin 800ms linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .spinner{ animation-duration: 1600ms; }
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .status-title{
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 6px;
  }
  .status-sub{
    font-size:0.9rem;
    color:var(--slate);
    margin:0;
  }

  /* ---------- Error panel ---------- */

  .error-icon{
    width:44px; height:44px;
    margin:0 auto 16px;
    border-radius:50%;
    background:#F5E6E2;
    color:var(--danger);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .error-icon svg{ width:22px; height:22px; }

  .status-card.is-error .status-title{ color:var(--danger); }

  .retry-btn{
    margin-top:18px;
    min-height:44px;
    padding:0 22px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-size:0.95rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
  }
  .retry-btn:hover{ background:var(--ink-soft); }
  .retry-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  /* ---------- Small screens ---------- */

  @media (max-width:360px){
    .action-title{ font-size:1rem; }
    h1{ font-size:1.55rem; }
  }

  /* ---------- Landscape / short viewports ---------- */

  @media (max-height:480px) and (orientation:landscape){
    main{ padding-top:10px; padding-bottom:16px; align-items:flex-start; }
    .lede{ margin-bottom:16px; }
    .actions{ gap:10px; }
    .action{ min-height:60px; padding:12px 16px; }
  }

  @media (min-width:640px){
    .action{ padding:18px 22px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <button type="button" class="back-link" id="topBack" hidden aria-label="Back to menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Back to Menu
    </button>
  </div>

  <main>
    <div class="stage">

      <!-- MAIN MENU -->
      <section class="panel" id="panel-main" aria-labelledby="pageTitle">
        <div class="lede">
          <span class="kicker">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
            Faculty Classroom
          </span>
          <h1 id="pageTitle" class="display">Virtual Class</h1>
          <p>Start or schedule your online classroom in one tap.</p>
        </div>

        <div class="actions">
          <button type="button" class="action action--now" id="btnNow" aria-describedby="nowSub">
            <span class="action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l5-3v10l-5-3"/><rect x="2" y="6" width="13" height="12" rx="2"/></svg>
            </span>
            <span class="action-text">
              <span class="live-dot">LIVE NOW</span>
              <span class="action-title">Initiate an online class now</span>
              <span class="action-sub" id="nowSub">Opens your classroom immediately</span>
            </span>
            <svg class="action-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>

          <button type="button" class="action action--schedule" id="btnSchedule" aria-describedby="scheduleSub">
            <span class="action-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 14v4M10 16h4"/></svg>
            </span>
            <span class="action-text">
              <span class="action-title">Schedule an online class for later</span>
              <span class="action-sub" id="scheduleSub">Pick a date and time for your class</span>
            </span>
            <svg class="action-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <div class="menu-footer">
          <button type="button" class="menu-back" id="mainBack">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Back to Menu
          </button>
        </div>
      </section>

      <!-- LOADING -->
      <section class="panel" id="panel-loading" hidden aria-live="polite">
        <div class="status-card">
          <div class="spinner" role="status" aria-hidden="true"></div>
          <p class="status-title" id="loadingTitle">Opening your classroom…</p>
          <p class="status-sub">Please wait a moment.</p>
        </div>
      </section>

      <!-- ERROR -->
      <section class="panel" id="panel-error" hidden aria-live="assertive">
        <div class="status-card is-error">
          <div class="error-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
          </div>
          <p class="status-title">Unable to open your classroom</p>
          <p class="status-sub">Please check your internet connection and try again.</p>
          <button type="button" class="retry-btn" id="retryBtn">Try again</button>
        </div>
      </section>

    </div>
  </main>

<script>
(function(){
  "use strict";

  // ---- Configuration: the only two destinations this widget uses ----
  var SCHEDULE_MEETING_URL = "https://meeting.zoho.in/meeting/60088989052/1671853000000008012/meeting/create";
  var START_MEETING_URL    = "https://meeting.zoho.in/meeting/presenter.do?type=video&x-meeting-org=60088989052";

  var NAV_TIMEOUT_MS = 4000; // if we're still here after this long, assume navigation failed

  var panelMain    = document.getElementById("panel-main");
  var panelLoading = document.getElementById("panel-loading");
  var panelError   = document.getElementById("panel-error");
  var loadingTitle = document.getElementById("loadingTitle");

  var btnNow      = document.getElementById("btnNow");
  var btnSchedule = document.getElementById("btnSchedule");
  var retryBtn    = document.getElementById("retryBtn");
  var mainBack    = document.getElementById("mainBack");
  var topBack     = document.getElementById("topBack");

  var pendingUrl = null;
  var pendingLabel = null;
  var navTimer = null;
  var isNavigating = false;

  function showPanel(panel){
    [panelMain, panelLoading, panelError].forEach(function(p){
      p.hidden = (p !== panel);
    });
  }

  function goToMenu(){
    isNavigating = false;
    if (navTimer) { clearTimeout(navTimer); navTimer = null; }
    btnNow.disabled = false;
    btnSchedule.disabled = false;
    showPanel(panelMain);
  }

  function attemptNavigation(url, label){
    if (isNavigating) { return; } // guard against double-clicks / duplicate taps
    isNavigating = true;
    pendingUrl = url;
    pendingLabel = label;

    btnNow.disabled = true;
    btnSchedule.disabled = true;
    loadingTitle.textContent = "Opening " + label + "…";
    showPanel(panelLoading);

    // If the app is still visible after NAV_TIMEOUT_MS, the same-tab
    // navigation didn't happen (blocked, offline, invalid environment, etc.)
    navTimer = setTimeout(function(){
      showPanel(panelError);
    }, NAV_TIMEOUT_MS);

    // Give the loading state a moment to paint before navigating away.
    setTimeout(function(){
      try {
        window.location.href = url;
      } catch (err) {
        if (navTimer) { clearTimeout(navTimer); navTimer = null; }
        showPanel(panelError);
      }
    }, 250);
  }

  btnNow.addEventListener("click", function(){
    attemptNavigation(START_MEETING_URL, "your classroom");
  });

  btnSchedule.addEventListener("click", function(){
    attemptNavigation(SCHEDULE_MEETING_URL, "your classroom");
  });

  retryBtn.addEventListener("click", function(){
    if (pendingUrl){
      attemptNavigation(pendingUrl, pendingLabel);
    } else {
      goToMenu();
    }
  });

  mainBack.addEventListener("click", function(){
    if (window.history.length > 1){
      window.history.back();
    }
  });

  topBack.addEventListener("click", function(){
    if (window.history.length > 1){
      window.history.back();
    }
  });

  // Show the top "Back to Menu" affordance only when there's somewhere to go back to.
  if (window.history.length > 1){
    topBack.hidden = false;
  }

  // If a user returns to this page via the browser Back button (e.g. from
  // Zoho Meeting) while a bfcache restore fires, make sure we're reset to
  // the main menu rather than stuck on a loading/error state.
  window.addEventListener("pageshow", function(){
    goToMenu();
  });

})();
</script>
</body>
</html>
